<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0052cc"/>
      <stop offset="100%" stop-color="#002b80"/>
    </linearGradient>
    <filter id="iconShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Fondo redondeado suave -->
  <rect width="128" height="128" rx="28" fill="#f8f9fa"/>

  <!-- Documento -->
  <g transform="translate(18, 14)" filter="url(#iconShadow)">
    <path d="M10 8 C10 3.5, 13.5 0, 18 0 L64 0 C66.5 0, 69 1, 71 3 L87 19 C89 21, 90 23.5, 90 26 L90 90 C90 94.5, 86.5 98, 82 98 L18 98 C13.5 98, 10 94.5, 10 90 Z" fill="url(#iconGrad)"/>
    
    <!-- Pliegue de esquina -->
    <path d="M64 0 L64 19 C64 22.5, 67.5 26, 71 26 L90 26 Z" fill="#003d99" opacity="0.85"/>
    
    <!-- Líneas del comprobante -->
    <rect x="25" y="36" width="48" height="6" rx="3" fill="#ffffff" opacity="0.95"/>
    <rect x="25" y="48" width="36" height="6" rx="3" fill="#ffffff" opacity="0.8"/>
    <rect x="25" y="60" width="42" height="6" rx="3" fill="#ffffff" opacity="0.8"/>
    
    <!-- Sello dorado de CAE aprobado con Sol -->
    <circle cx="68" cy="74" r="17" fill="#fcc419" stroke="#ffffff" stroke-width="3"/>
    <path d="M60 74 L65 79 L76 68" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>

