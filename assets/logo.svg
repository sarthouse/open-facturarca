<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0052cc"/>
      <stop offset="100%" stop-color="#002b80"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#74c0fc"/>
      <stop offset="100%" stop-color="#1c7ed6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="3" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- ISOTIPO: Documento Fiscal / Escudo con sol de mayo estilizado -->
  <g transform="translate(15, 10)" filter="url(#shadow)">
    <!-- Base del documento -->
    <path d="M15 8 C15 3.5, 18.5 0, 23 0 L65 0 C67.5 0, 70 1, 72 3 L87 18 C89 20, 90 22.5, 90 25 L90 92 C90 96.5, 86.5 100, 82 100 L23 100 C18.5 100, 15 96.5, 15 92 Z" fill="url(#primaryGrad)"/>
    
    <!-- Pliegue de esquina superior derecha -->
    <path d="M65 0 L65 18 C65 21.5, 68.5 25, 72 25 L90 25 Z" fill="#003d99" opacity="0.8"/>
    
    <!-- Rayas del comprobante fiscal (estilizadas) -->
    <rect x="28" y="38" width="48" height="5" rx="2.5" fill="#ffffff" opacity="0.9"/>
    <rect x="28" y="50" width="36" height="5" rx="2.5" fill="#ffffff" opacity="0.75"/>
    <rect x="28" y="62" width="42" height="5" rx="2.5" fill="#ffffff" opacity="0.75"/>
    
    <!-- Sello circular / Sol de Argentina & Check de autorización -->
    <circle cx="68" cy="76" r="16" fill="#fcc419" stroke="#ffffff" stroke-width="2.5"/>
    <path d="M61 76 L66 81 L76 71" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- LOGOTIPO: Tipografía y Branding -->
  <g transform="translate(130, 20)">
    <!-- "Open" -->
    <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="300" fill="#495057" letter-spacing="-0.5">Open</text>
    
    <!-- "Factur" -->
    <text x="86" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="800" fill="#1864ab" letter-spacing="-0.5">Factur</text>
    
    <!-- "ARCA" -->
    <text x="200" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="900" fill="#002b80" letter-spacing="1">ARCA</text>
    
    <!-- Badge Bandera Argentina de acento -->
    <rect x="312" y="24" width="28" height="6" rx="2" fill="#74c0fc"/>
    <rect x="312" y="30" width="28" height="6" rx="1" fill="#ffffff"/>
    <circle cx="326" cy="33" r="2" fill="#fcc419"/>
    <rect x="312" y="36" width="28" height="6" rx="2" fill="#74c0fc"/>

    <!-- Bajada descriptiva / Tagline -->
    <text x="2" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#6c757d" letter-spacing="0.5">FACTURACIÓN ELECTRÓNICA PARA WOOCOMMERCE</text>
    
    <text x="2" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#2b8a3e">● OPEN SOURCE &amp; MULTI-EMPRESA</text>
  </g>
</svg>

